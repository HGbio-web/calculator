<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>機能食品標示助手 (Gemini 3 版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0fdf4; font-family: sans-serif; }
        .label-box { border: 2px solid #000; background: #fff; width: 300px; padding: 12px; font-weight: bold; color: #000; }
        .line { border-bottom: 1px solid #000; display: flex; justify-content: space-between; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <header class="bg-white p-4 rounded-xl shadow-sm mb-6 flex justify-between items-center border border-green-100">
            <h1 class="text-xl font-bold text-green-800">🧪 營養標示開發工具</h1>
            <input type="password" id="apiKey" class="border p-2 rounded-lg w-64" placeholder="請貼上 Gemini API Key">
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <button onclick="addIng()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">+ 新增成分</button>
                <div id="list" class="space-y-4"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-lg h-fit sticky top-4">
                <div class="label-box mx-auto">
                    <div class="text-2xl text-center border-b-4 border-black mb-1">營養標示</div>
                    <div id="serv" class="text-sm border-b-2 border-black pb-1">每一份量 0 公克</div>
                    <div class="line font-black"><span></span><span>每 100 公克</span></div>
                    <div class="line"><span>熱量</span><span id="v-cal">0 大卡</span></div>
                    <div class="line"><span>蛋白質</span><span id="v-pro">0 公克</span></div>
                    <div class="line"><span>脂肪</span><span id="v-fat">0 公克</span></div>
                    <div class="line"><span>碳水化合物</span><span id="v-carb">0 公克</span></div>
                    <div class="line" style="border:none"><span>鈉</span><span id="v-sod">0 毫克</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let items = [];
        function addIng() {
            const id = Date.now();
            items.push({ id, name: '新原料', w: 0, cal: 0, pro: 0, fat: 0, sod: 0 });
            render();
        }

        function render() {
            const container = document.getElementById('list');
            container.innerHTML = items.map(i => `
                <div class="bg-white p-4 rounded-xl border">
                    <div class="flex justify-between mb-2">
                        <input type="text" value="${i.name}" class="font-bold border-b">
                        <button onclick="runAi(${i.id})" class="bg-green-100 text-green-700 px-3 py-1 rounded">📸 辨識</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <div>添加(g)<input type="number" value="${i.w}" oninput="up(${i.id},'w',this.value)" class="w-full border p-1"></div>
                        <div>熱量/100g<input type="number" value="${i.cal}" oninput="up(${i.id},'cal',this.value)" class="w-full border p-1"></div>
                        <div>鈉/100g<input type="number" value="${i.sod}" oninput="up(${i.id},'sod',this.value)" class="w-full border p-1"></div>
                    </div>
                </div>
            `).join('');
        }

        function up(id, k, v) {
            const i = items.find(x => x.id === id);
            i[k] = parseFloat(v) || 0;
            calc();
        }

        function calc() {
            let totalW = items.reduce((s, i) => s + i.w, 0) || 1;
            document.getElementById('serv').innerText = `每一份量 ${totalW.toFixed(1)} 公克`;
            ['cal', 'pro', 'fat', 'sod'].forEach(k => {
                let val = items.reduce((s, i) => s + (i[k] * i.w / 100), 0);
                let per100 = (val / totalW * 100);
                document.getElementById('v-' + k).innerText = (k === 'sod' ? Math.round(per100) : per100.toFixed(1)) + (k === 'sod' ? ' 毫克' : (k === 'cal' ? ' 大卡' : ' 公克'));
            });
        }

        async function runAi(id) {
            const key = document.getElementById('apiKey').value;
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    // 關鍵修改：使用截圖中看到的 gemini-3-flash-preview
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`;
                    try {
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: "Extract nutrition data per 100g. Return JSON: {\"cal\":0,\"pro\":0,\"fat\":0,\"sod\":0}" }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }]
                            })
                        });
                        const data = await resp.json();
                        const text = data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0];
                        const res = JSON.parse(text);
                        const i = items.find(x => x.id === id);
                        Object.assign(i, res);
                        render();
                        calc();
                        alert('成功！');
                    } catch (err) { alert('辨識出錯：' + err.message); }
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        }
        addIng();
    </script>
</body>
</html>
