<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機能食品標示研發助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --p-green: #f0fdf4; --p-yellow: #fefce8; --accent: #16a34a; }
        body { background: linear-gradient(135deg, var(--p-green) 0%, var(--p-yellow) 100%); min-height: 100vh; font-family: sans-serif; }
        .nutrition-table { border: 2px solid black; background: white; color: black; font-weight: bold; width: 300px; padding: 10px; }
        .table-header { font-size: 24px; text-align: center; border-bottom: 4px solid black; margin-bottom: 4px; padding-bottom: 2px; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid black; padding: 2px 0; }
        .indent { padding-left: 15px; }
        .dv-info { font-size: 11px; font-weight: normal; margin-top: 10px; border-top: 1px solid black; padding-top: 5px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-2">
                    <span class="text-4xl">🧪</span> 機能食品標示研發助手
                </h1>
                <p class="text-gray-600">支援國外原料規格書 AI 辨識 與 TFDA 雙格式切換</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100 w-full md:w-80">
                <label class="block text-xs font-bold text-green-700 mb-1 uppercase tracking-wider">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="在此輸入您的 API 金鑰" 
                       class="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition-all">
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-6">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">✒️ 配方組成</h2>
                    <div class="flex items-center gap-2 text-sm">
                        <span>總份數：</span>
                        <input type="number" id="totalServings" value="1" min="1" oninput="updateAll()" class="w-16 p-1 border rounded text-center">
                    </div>
                </div>

                <div id="ingredientsContainer" class="space-y-4"></div>

                <button onclick="addIngredient()" class="w-full py-4 border-2 border-dashed border-green-300 rounded-xl text-green-700 font-bold hover:bg-green-50 hover:border-green-400 transition-all flex items-center justify-center gap-2">
                    <span class="text-2xl">+</span> 添加新成分 / 原料規格
                </button>
            </div>

            <div class="lg:col-span-5">
                <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100 sticky top-8">
                    <div class="flex items-center gap-2 mb-6">
                        <span class="text-xl">📑</span>
                        <h2 class="text-xl font-bold text-gray-800">TFDA 法規標籤預覽</h2>
                    </div>

                    <div class="flex justify-center mb-6">
                        <div class="inline-flex p-1 bg-gray-100 rounded-full shadow-inner">
                            <button id="btn100" onclick="switchMode('100g')" class="px-6 py-2 rounded-full text-sm font-bold transition-all bg-green-600 text-white shadow-md">每 100 公克</button>
                            <button id="btnDV" onclick="switchMode('DV')" class="px-6 py-2 rounded-full text-sm font-bold transition-all text-gray-600 hover:text-gray-800">每日參考值百分比 (%)</button>
                        </div>
                    </div>

                    <div id="labelCaptureArea" class="flex justify-center p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="nutrition-table">
                            <div class="table-header">營養標示</div>
                            <div id="servingsDisplay" class="text-sm mb-1">每一份量 0.0 公克<br>本包裝含 1 份</div>
                            <div class="row" style="border-bottom: 3px solid black"><span id="colHeaderL"></span><span id="colHeaderR">每 100 公克</span></div>
                            <div class="row"><span>熱量</span><span id="label-cal">0.0 大卡</span></div>
                            <div class="row"><span>蛋白質</span><span id="label-pro">0.0 公克</span></div>
                            <div class="row"><span>脂肪</span><span id="label-fat">0.0 公克</span></div>
                            <div class="row"><span class="indent">飽和脂肪</span><span id="label-sfat">0.0 公克</span></div>
                            <div class="row"><span class="indent">反式脂肪</span><span id="label-tfat">0.0 公克</span></div>
                            <div class="row"><span>碳水化合物</span><span id="label-carb">0.0 公克</span></div>
                            <div class="row"><span class="indent">糖</span><span id="label-sugar">0.0 公克</span></div>
                            <div class="row" style="border-bottom: none"><span>鈉</span><span id="label-sod">0 毫克</span></div>
                            <div class="dv-info">
                                * 每日參考值：熱量 2000 大卡、蛋白質 60 公克、脂肪 60 公克、飽和脂肪 18 公克、碳水化合物 300 公克、鈉 2400 毫克。
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let ingredients = [];
        let displayMode = '100g';
        const DV = { cal: 2000, pro: 60, fat: 60, sfat: 18, carb: 300, sod: 2400 };

        function addIngredient() {
            const id = Date.now();
            ingredients.push({ id, name: '新成分', weight: 0, cal: 0, pro: 0, fat: 0, sfat: 0, tfat: 0, carb: 0, sugar: 0, sod: 0 });
            renderIngredients();
        }

        function renderIngredients() {
            const container = document.getElementById('ingredientsContainer');
            container.innerHTML = ingredients.map(ing => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-1 h-full bg-green-400"></div>
                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-4">
                                <input type="text" value="${ing.name}" onchange="updateIng(${ing.id}, 'name', this.value)" 
                                       class="text-lg font-bold text-gray-800 bg-transparent border-b-2 border-transparent hover:border-gray-200 focus:border-green-500 outline-none w-48">
                                <button onclick="triggerAi(${ing.id})" class="p-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors" title="AI 辨識規格書">
                                    📸 辨識規格書
                                </button>
                                <button onclick="removeIng(${ing.id})" class="p-2 bg-red-50 text-red-400 rounded-lg hover:bg-red-100 transition-colors">🗑️</button>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="p-3 bg-yellow-50 rounded-xl border border-yellow-100">
                                    <label class="block text-[10px] font-bold text-yellow-700 uppercase">添加量 (g)</label>
                                    <input type="number" value="${ing.weight}" oninput="updateIng(${ing.id}, 'weight', this.value)" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                                <div class="p-3 bg-gray-50 rounded-xl border border-gray-100">
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">熱量 (100g)</label>
                                    <input type="number" value="${ing.cal}" oninput="updateIng(${ing.id}, 'cal', this.value)" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                                <div class="p-3 bg-gray-50 rounded-xl border border-gray-100">
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">蛋白質 (100g)</label>
                                    <input type="number" value="${ing.pro}" oninput="updateIng(${ing.id}, 'pro', this.value)" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                                <div class="p-3 bg-gray-50 rounded-xl border border-gray-100">
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">鈉 (mg/100g)</label>
                                    <input type="number" value="${ing.sod}" oninput="updateIng(${ing.id}, 'sod', this.value)" class="w-full bg-transparent text-lg font-bold outline-none">
                                </div>
                            </div>
                            <details class="mt-4 text-sm text-gray-500">
                                <summary class="cursor-pointer hover:text-green-600 font-medium">▼ 顯示更多八大營養素 (脂肪、碳水、糖...)</summary>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-3">
                                    <div><label class="block text-[10px]">脂肪</label><input type="number" value="${ing.fat}" oninput="updateIng(${ing.id}, 'fat', this.value)" class="w-full border-b outline-none text-center"></div>
                                    <div><label class="block text-[10px]">飽和脂肪</label><input type="number" value="${ing.sfat}" oninput="updateIng(${ing.id}, 'sfat', this.value)" class="w-full border-b outline-none text-center"></div>
                                    <div><label class="block text-[10px]">反式脂肪</label><input type="number" value="${ing.tfat}" oninput="updateIng(${ing.id}, 'tfat', this.value)" class="w-full border-b outline-none text-center"></div>
                                    <div><label class="block text-[10px]">碳水</label><input type="number" value="${ing.carb}" oninput="updateIng(${ing.id}, 'carb', this.value)" class="w-full border-b outline-none text-center"></div>
                                    <div><label class="block text-[10px]">糖</label><input type="number" value="${ing.sugar}" oninput="updateIng(${ing.id}, 'sugar', this.value)" class="w-full border-b outline-none text-center"></div>
                                </div>
                            </details>
                        </div>
                    </div>
                </div>
            `).join('');
            updateAll();
        }

        function updateIng(id, field, val) {
            const ing = ingredients.find(i => i.id === id);
            ing[field] = field === 'name' ? val : parseFloat(val) || 0;
            updateAll();
        }

        function removeIng(id) {
            ingredients = ingredients.filter(i => i.id !== id);
            renderIngredients();
        }

        function switchMode(mode) {
            displayMode = mode;
            document.getElementById('btn100').className = mode === '100g' ? 'px-6 py-2 rounded-full text-sm font-bold transition-all bg-green-600 text-white shadow-md' : 'px-6 py-2 rounded-full text-sm font-bold transition-all text-gray-600 hover:text-gray-800';
            document.getElementById('btnDV').className = mode === 'DV' ? 'px-6 py-2 rounded-full text-sm font-bold transition-all bg-green-600 text-white shadow-md' : 'px-6 py-2 rounded-full text-sm font-bold transition-all text-gray-600 hover:text-gray-800';
            document.getElementById('colHeaderR').innerText = mode === '100g' ? '每 100 公克' : '每日參考值百分比 (%)';
            updateAll();
        }

        function updateAll() {
            const servings = parseFloat(document.getElementById('totalServings').value) || 1;
            let totalW = ingredients.reduce((sum, i) => sum + i.weight, 0);
            let perServingW = totalW / servings;

            let totals = { cal: 0, pro: 0, fat: 0, sfat: 0, tfat: 0, carb: 0, sugar: 0, sod: 0 };
            
            ingredients.forEach(i => {
                const ratio = i.weight / 100;
                totals.cal += i.cal * ratio;
                totals.pro += i.pro * ratio;
                totals.fat += i.fat * ratio;
                totals.sfat += i.sfat * ratio;
                totals.tfat += i.tfat * ratio;
                totals.carb += i.carb * ratio;
                totals.sugar += i.sugar * ratio;
                totals.sod += i.sod * ratio;
            });

            const servingTotal = {};
            for(let k in totals) servingTotal[k] = totals[k] / servings;

            document.getElementById('servingsDisplay').innerHTML = `每一份量 ${perServingW.toFixed(1)} 公克<br>本包裝含 ${servings} 份`;

            const format = (val, key) => {
                if(displayMode === '100g') {
                    const v = (val / totalW * 100) || 0;
                    return key === 'sod' ? Math.round(v) : v.toFixed(1);
                } else {
                    const dvRef = DV[key] || 1;
                    return Math.round((val / servings) / dvRef * 100) + ' %';
                }
            };

            const unit = displayMode === '100g' ? '' : '';
            const suffix = displayMode === '100g' ? (key => key === 'sod' ? ' 毫克' : (key === 'cal' ? ' 大卡' : ' 公克')) : (k => '');

            document.getElementById('label-cal').innerText = format(totals.cal, 'cal') + suffix('cal');
            document.getElementById('label-pro').innerText = format(totals.pro, 'pro') + suffix('pro');
            document.getElementById('label-fat').innerText = format(totals.fat, 'fat') + suffix('fat');
            document.getElementById('label-sfat').innerText = format(totals.sfat, 'sfat') + suffix('sfat');
            document.getElementById('label-tfat').innerText = format(totals.tfat, 'tfat') + suffix('tfat');
            document.getElementById('label-carb').innerText = format(totals.carb, 'carb') + suffix('carb');
            document.getElementById('label-sugar').innerText = format(totals.sugar, 'sugar') + suffix('sugar');
            document.getElementById('label-sod').innerText = format(totals.sod, 'sod') + suffix('sod');
        }

        async function triggerAi(id) {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert('請先輸入 API Key');

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64Data = reader.result.split(',')[1];
                    await callGemini(id, base64Data, key);
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        async function callGemini(id, base64Image, key) {
            const prompt = "你是一位食品研發專家。請分析這張原料規格書(Specification)照片，提取出『每100克 (Per 100g)』的營養成分。只需回傳 JSON 格式如下，不要有額外文字：{\"cal\":熱量,\"pro\":蛋白質,\"fat\":脂肪,\"sfat\":飽和脂肪,\"tfat\":反式脂肪,\"carb\":碳水,\"sugar\":糖,\"sod\":鈉}。注意：如果原始單位是每份，請幫我換算成每100克的值。";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API 呼叫失敗');
                }

                const text = data.candidates[0].content.parts[0].text;
                const cleanJson = text.replace(/```json|```/g, '');
                const result = JSON.parse(cleanJson);

                Object.keys(result).forEach(key => {
                    updateIng(id, key, result[key]);
                });
                renderIngredients();
                alert('辨識成功！數值已填入。');
            } catch (err) {
                console.error(err);
                alert('辨識失敗，原因：' + err.message + '\n請檢查 API Key 是否正確或圖片是否清晰。');
            }
        }

        addIngredient();
    </script>
</body>
</html>
